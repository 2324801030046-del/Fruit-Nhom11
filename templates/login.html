{% extends 'base.html' %}
{% block title %}Đăng nhập · Nhóm 11{% endblock %}
{% block body_class %}dashboard login-page{% endblock %}
{% block body %}
<section class="panel login-panel" aria-labelledby="login-title">
  <p class="login-project">Phân loại trái cây CNN</p>
  <h1 id="login-title">Đăng nhập</h1>
  <form class="login-form" action="{{ url_for('login') }}" method="post">
    {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
    <label for="username">Tên đăng nhập</label>
    <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" required>
    <label for="password">Mật khẩu</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Đăng nhập</button>
  </form>
</section>
{% endblock %}
